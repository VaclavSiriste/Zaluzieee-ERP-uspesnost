<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metriky - Webová Stránka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }

        .metric-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .metric-value {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .info-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .info-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .info-section p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Sledování Metrik</h1>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Návštěvy</div>
                <div class="metric-value" id="visitCount">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Čas na stránce</div>
                <div class="metric-value" id="timeSpent">0s</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Kliknutí</div>
                <div class="metric-value" id="clickCount">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Reakčný čas</div>
                <div class="metric-value" id="avgResponseTime">0ms</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-primary" onclick="trackEvent()">Sledovat Akci</button>
            <button class="btn-secondary" onclick="resetMetrics()">Resetovat</button>
            <button class="btn-secondary" onclick="exportMetrics()">Exportovat</button>
        </div>

        <div class="info-section">
            <h2>ℹ️ Informace</h2>
            <p>Tato aplikace automaticky sleduje a počítá různé metriky vaší aktivity na stránce. Metriky jsou uloženy v lokálním úložišti prohlížeče.</p>
        </div>
    </div>

    <script src="metrics.js"></script>
</body>
</html>
